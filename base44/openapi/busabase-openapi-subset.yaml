openapi: 3.0.3
info:
  title: Busabase API (Base44 subset)
  version: 1.3.0
  description: "The Busabase operations a Base44 app needs: read Bases and records, search, and create or update records. Writes are Change Requests: merged at once with a write-level API key, queued for review otherwise. Generated from https://busabase.com/api/v1/openapi.json by scripts/build-openapi-subset.ts."
servers:
  - url: https://busabase.com/api/v1
    description: Your Busabase origin
tags:
  - name: Busabase
paths:
  /auth:
    get:
      operationId: verifyAuth
      summary: Check the connection
      description: Returns the space the key is working in and every space it can reach. Call this first to confirm the integration is wired to the right space.
      tags:
        - Busabase
      responses:
        "200":
          description: "The space this request targets, the acting user, their membership, and every space the user belongs to (`spaces`). Open source returns the local space/user; the cloud resolves the real ones from the user API key — when `spaces` has more than one entry, target a specific space with the `x-busabase-space` header instead of relying on the default. Next: call playbooks search with the user's intent before other work."
          content:
            application/json:
              schema:
                type: object
                properties:
                  space:
                    $ref: "#/components/schemas/AuthSpace"
                  user:
                    type: object
                    properties:
                      id:
                        type: string
                      name:
                        type: string
                      email:
                        type: string
                        nullable: true
                      image:
                        type: string
                        nullable: true
                    required:
                      - id
                      - name
                      - email
                      - image
                  member:
                    type: object
                    properties:
                      userId:
                        type: string
                      spaceId:
                        type: string
                      role:
                        type: string
                    required:
                      - userId
                      - spaceId
                      - role
                  spaces:
                    type: array
                    items:
                      $ref: "#/components/schemas/AuthSpace"
                  createdSpace:
                    type: boolean
                  bootstrapRequired:
                    type: boolean
                  credentialPermissionLevel:
                    enum:
                      - read
                      - changeRequest
                      - write
                      - manage
                    type: string
                  effectivePermissionLevel:
                    enum:
                      - read
                      - changeRequest
                      - write
                      - manage
                    type: string
                required:
                  - space
                  - user
                  - member
                  - spaces
  /bases:
    get:
      operationId: listBases
      summary: List Bases (tables) and their fields
      description: Each Base lists its fields with their slugs and types. Record `fields` are keyed by these slugs.
      tags:
        - Busabase
      parameters:
        - name: status
          in: query
          schema:
            enum:
              - active
              - archived
            type: string
            default: active
            description: "`active` (default) or the soft-archived set. Archived rows have the SAME shape as live ones — this is a predicate, not a different resource."
          allowEmptyValue: true
          allowReserved: true
        - name: fields
          in: query
          schema:
            enum:
              - all
              - links
            type: string
            default: all
            description: "`all` (default): every live field. `links`: only relation and lookup fields — enough to see how Bases connect (relation targets, lookups, inverse relations) across a large space, not to read or edit records. Fetch one Base with `bases.get` for its full schema."
          allowEmptyValue: true
          allowReserved: true
      responses:
        "200":
          description: Developer-facing Bases. `status=archived` returns the archived ones instead of the active ones. `fields=links` trims each Base to its relation and lookup fields.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Base"
  /bases/{baseId}:
    get:
      operationId: getBase
      summary: Get one Base and its fields
      description: Use it to read a Base's field slugs and select options before writing records.
      tags:
        - Busabase
      parameters:
        - name: baseId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Single Base by id or slug, or 404 when it does not exist or is not visible.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Base"
  /records:
    get:
      operationId: listRecords
      summary: List records in a Base
      description: "Pass baseId. Cursor-paginated: send nextCursor back as `cursor`. Current field values are in `headCommit.payload`."
      tags:
        - Busabase
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
            description: Records per page. Capped at 100; ask for the next page with `cursor`.
          allowEmptyValue: true
          allowReserved: true
        - name: baseId
          in: query
          schema:
            type: string
            description: Restrict to one Base — its id or slug; an unknown one is a 404, never an empty page. OMITTING it lists records across the WHOLE SPACE, which is rarely what a caller means and is easy to miss — every other parameter still applies, so an unscoped query looks like it worked.
          allowEmptyValue: true
          allowReserved: true
        - name: cursor
          in: query
          schema:
            type: string
            description: "Opaque page cursor: pass back the `nextCursor` from the previous response. Do not construct or parse it — it is keyed on `createdAt`, or on the sort field when `sort` is given, and that is an implementation detail."
          allowEmptyValue: true
          allowReserved: true
        - name: status
          in: query
          schema:
            enum:
              - active
              - archived
            type: string
            default: active
            description: "`active` is the live table; `archived` is the Base's trash."
          allowEmptyValue: true
          allowReserved: true
        - name: summary
          in: query
          schema:
            anyOf:
              - type: boolean
              - enum:
                  - "true"
              - enum:
                  - "false"
            description: "Return compact list previews: field values larger than 4 KB are replaced with omission markers, and Base field definitions and computed lookup values are omitted. Omit for full records; use records.get to read the complete content of a selected row."
          allowEmptyValue: true
          allowReserved: true
        - name: filters
          in: query
          schema:
            type: array
            items:
              $ref: "#/components/schemas/RecordFilter"
            description: View filters — a best-effort SUPERSET, not an exact answer. They mean what the grid means (a currency number reads as "$1,234.00", a select as its choice label), and the server may return records that do not match, so the caller must narrow them again and must NOT trust `limit` alongside them. Use `valueFilters` when you need an exact row set.
          style: deepObject
          explode: true
          allowEmptyValue: true
          allowReserved: true
        - name: valueFilters
          in: query
          schema:
            type: array
            items:
              $ref: "#/components/schemas/RecordValueFilter"
            description: "EXACT value comparisons, unlike `filters` which are a best-effort superset. The returned rows are exactly those that match, so `limit` can be trusted alongside them. Entries are ANDed; an entry may instead be `{ any: [...] }` to OR its comparisons, which makes the list a CNF and can express any boolean combination. Requires `baseId`. Compares number, date, checkbox and text-like fields (text and select support eq/ne only); anything else is a 400 rather than a silently dropped condition."
          style: deepObject
          explode: true
          allowEmptyValue: true
          allowReserved: true
        - name: sort
          in: query
          schema:
            $ref: "#/components/schemas/RecordSort"
            description: Sort by one field. Only number and date fields sort authoritatively (their typed value column matches a client's own ordering); any other field type is returned in the default order and left for the caller to sort. The field's type comes from the Base's schema unless `fieldType` overrides it; an unknown field is a 400. Without `baseId`, `fieldType` is required.
          style: deepObject
          explode: true
          allowEmptyValue: true
          allowReserved: true
      responses:
        "200":
          description: A page of canonical records plus an opaque nextCursor (null at the end). `status=archived` lists the Base's trash instead of its live rows.
          content:
            application/json:
              schema:
                type: object
                properties:
                  records:
                    type: array
                    items:
                      $ref: "#/components/schemas/Record"
                  nextCursor:
                    type: string
                    nullable: true
                required:
                  - records
                  - nextCursor
  /records/get:
    get:
      operationId: getRecord
      summary: Get one record by id, or by a field value
      description: Either recordId alone, or baseId + fieldSlug + valueText together (for example the field that holds your own app's id). 404 means no such record.
      tags:
        - Busabase
      parameters:
        - name: recordId
          in: query
          required: false
          schema:
            type: string
            minLength: 1
            description: Record id selector. Use alone; do not combine with field selector fields.
          allowEmptyValue: true
          allowReserved: true
        - name: baseId
          in: query
          required: false
          schema:
            type: string
            description: "Field selector: Base id. Requires fieldSlug and valueText."
          allowEmptyValue: true
          allowReserved: true
        - name: fieldSlug
          in: query
          required: false
          schema:
            type: string
            minLength: 1
            description: "Field selector: exact field slug. Requires baseId and valueText."
          allowEmptyValue: true
          allowReserved: true
        - name: valueText
          in: query
          required: false
          schema:
            type: string
            minLength: 1
            description: "Field selector: exact text value. Requires baseId and fieldSlug."
          allowEmptyValue: true
          allowReserved: true
      responses:
        "200":
          description: One canonical record selected by id or exact field value.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Record"
        "400":
          description: "400"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: "404"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /records/search:
    get:
      operationId: searchRecordsByField
      summary: Find records whose field contains some text
      description: Requires baseId, fieldSlug and valueText.
      tags:
        - Busabase
      parameters:
        - name: baseId
          in: query
          required: false
          schema:
            type: string
            description: Restrict to one Base — its id or slug; an unknown one is a 404. Omitting it searches the whole space.
          allowEmptyValue: true
          allowReserved: true
        - name: fieldSlug
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            description: The field's SLUG, not its display name — visible in the Base's field settings. With `baseId`, a slug the Base does not have is a 400 listing its fields.
          allowEmptyValue: true
          allowReserved: true
        - name: valueText
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            description: Matched by EXACT equality, not substring or fuzzy — this is the de-dup-by-key lookup. Use `/api/v1/search` for full-text.
          allowEmptyValue: true
          allowReserved: true
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
            description: Maximum matches to return. Capped at 100.
          allowEmptyValue: true
          allowReserved: true
      responses:
        "200":
          description: Canonical records matching a field text filter.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Record"
  /records/count:
    get:
      operationId: countRecords
      summary: Count records in a Base
      description: Exact count. Pass baseId.
      tags:
        - Busabase
      parameters:
        - name: baseId
          in: query
          schema:
            type: string
            description: Restrict to one Base — its id or slug; an unknown one is a 404, not a 0. Omitting it counts every record in the space. Required as soon as `viewId`, `filters` or `valueFilters` is given — a field slug only means something within one Base.
          allowEmptyValue: true
          allowReserved: true
        - name: viewId
          in: query
          schema:
            type: string
            description: Count only what this saved View would display. Its filters apply; its sort is ignored, since a count has no order. Requires `baseId`.
          allowEmptyValue: true
          allowReserved: true
        - name: filters
          in: query
          schema:
            type: array
            items:
              $ref: "#/components/schemas/RecordFilter"
            description: Ad-hoc conditions, ANDed with the View's own when `viewId` is also given. Unlike `records.list`'s superset `filters`, the COUNT is exact either way — but a condition whose exactness cannot be proven makes the server read every candidate row instead of running one aggregate, so prefer `valueFilters` where it fits. Requires `baseId`.
          style: deepObject
          explode: true
          allowEmptyValue: true
          allowReserved: true
        - name: valueFilters
          in: query
          schema:
            type: array
            items:
              $ref: "#/components/schemas/RecordValueFilter"
            description: EXACT value comparisons, same shape as `records.list`'s. Always exact, so a count scoped only by these stays a single SQL count instead of reading every candidate row. Requires `baseId`.
          style: deepObject
          explode: true
          allowEmptyValue: true
          allowReserved: true
      responses:
        "200":
          description: "Total active records matching the scope: the whole space, one Base, a saved View, an ad-hoc filter set, or a combination."
          content:
            application/json:
              schema:
                type: object
                properties:
                  total:
                    type: integer
                    minimum: 0
                    maximum: 9007199254740991
                required:
                  - total
  /search:
    get:
      operationId: searchWorkspace
      summary: Search the whole workspace
      description: Full-text search across records, files and docs. Use `query`; narrow with `inNodeId` or `sources`.
      tags:
        - Busabase
      parameters:
        - name: query
          in: query
          schema:
            type: string
            default: ""
            description: Full-text query. An empty string matches nothing.
          allowEmptyValue: true
          allowReserved: true
        - name: mode
          in: query
          schema:
            enum:
              - quick
              - full
            type: string
            default: full
            description: Search depth. `quick` skips live file-body scans for typeahead; `full` preserves complete search behavior.
          allowEmptyValue: true
          allowReserved: true
        - name: surface
          in: query
          schema:
            enum:
              - quick
              - advanced
            type: string
            description: Optional first-party UI surface for aggregate quality metrics. API/CLI callers should omit it.
          allowEmptyValue: true
          allowReserved: true
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
            description: Results per page. Capped at 100; note the default is 20, not 50.
          allowEmptyValue: true
          allowReserved: true
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            maximum: 9007199254740991
            default: 0
            description: 0-indexed skip count. This endpoint pages by offset, not by cursor.
          allowEmptyValue: true
          allowReserved: true
        - name: sources
          in: query
          schema:
            anyOf:
              - type: array
                items:
                  enum:
                    - records
                    - files
                    - names
                    - nodes
                  type: string
              - enum:
                  - records
                  - files
                  - names
                  - nodes
                type: string
            description: Restrict which content is searched. Omitting it searches ALL sources. Repeat the parameter to pass several (`?sources=records&sources=files`); a single occurrence is accepted as a bare value.
          allowEmptyValue: true
          allowReserved: true
        - name: sort
          in: query
          schema:
            enum:
              - relevance
              - updated_desc
              - updated_asc
              - created_desc
              - created_asc
            type: string
            default: relevance
            description: Result order. `relevance` (default) keeps each source's own ranking — for records that is the full-text rank, for everything else most-recently-updated first. The four explicit orders sort every source by the same column so a mixed result set is comparable.
          allowEmptyValue: true
          allowReserved: true
        - name: updatedAfter
          in: query
          schema:
            type: string
            format: date-time
            description: Inclusive lower bound, ISO 8601. A UTC `Z` or an explicit offset; not a bare local time.
          allowEmptyValue: true
          allowReserved: true
        - name: updatedBefore
          in: query
          schema:
            type: string
            format: date-time
            description: Inclusive upper bound, ISO 8601. A UTC `Z` or an explicit offset; not a bare local time.
          allowEmptyValue: true
          allowReserved: true
        - name: createdBy
          in: query
          schema:
            type: string
            description: Restrict to one creator. Matches the actor id, which may be an agent or API key.
          allowEmptyValue: true
          allowReserved: true
        - name: inNodeId
          in: query
          schema:
            type: string
            description: Limit to this node and its descendants.
          allowEmptyValue: true
          allowReserved: true
      responses:
        "200":
          description: Paginated search results across records, change requests, Bases, File nodes, and Assets.
          content:
            application/json:
              schema:
                type: object
                properties:
                  query:
                    type: string
                  limit:
                    type: number
                  offset:
                    type: number
                  hasMore:
                    type: boolean
                  results:
                    type: array
                    items:
                      $ref: "#/components/schemas/SearchResult"
                  contentTruncated:
                    type: boolean
                    default: false
                required:
                  - query
                  - limit
                  - offset
                  - hasMore
                  - results
  /bases/{baseId}/change-requests:
    post:
      operationId: createRecord
      summary: Create a record in a Base
      description: "Body: `fields` keyed by field slug. Send a stable `idempotencyKey` (for example `base44:Order:<id>`) so a retry returns the first result instead of creating a duplicate. With a write-level key the response is the new record (`materialized: true`); with a change-request-level key it is a Change Request waiting for review (`materialized: false`)."
      tags:
        - Busabase
      parameters:
        - name: baseId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                fields:
                  type: object
                  additionalProperties: {}
                  description: Record field values keyed by field slug. A field id or its exact display name (any language, unambiguous) is mapped to the slug; a write in which no key names a field of the Base is a 400 listing the valid slugs. The base's PRIMARY field (its first field) becomes the record's display name and the change request title everywhere — always give it a short, human-readable value, never an id or placeholder.
                message:
                  type: string
                  default: Initial change request
                  description: Explanation shown to the human reviewer. Write a conventional-commit style subject — imperative verb + what + why, e.g. "Add Acme Corp — qualified lead from the June webinar".
                submittedBy:
                  type: string
                  default: local-producer
                idempotencyKey:
                  type: string
                  description: "Optional client-supplied key that dedupes retries. Scoped per base + submitter: calling this endpoint again with the SAME idempotencyKey (e.g. after a timeout or a 5xx where you couldn't tell if the first call succeeded) returns the change request created by the first call instead of creating a duplicate. Omit for normal one-shot calls; only set it when you might retry."
                autoMerge:
                  type: boolean
              required:
                - fields
      responses:
        "200":
          description: "Merged in the same call when the actor has write access on the Base's node — the materialized record comes back (`materialized: true`). Review-first when the actor lacks write access or passes `autoMerge: false`: a pending ChangeRequest proposing the record (`materialized: false`)."
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: "#/components/schemas/MaterializedRecord"
                  - $ref: "#/components/schemas/PendingChangeRequest"
  /records/{recordId}/change-requests:
    post:
      operationId: updateRecord
      summary: Update a record
      description: 'Body: `operation: "update"` and a partial `fields` patch (omitted fields stay, null clears one). Same response rule as createRecord: the record when merged, a Change Request when it waits for review.'
      tags:
        - Busabase
      parameters:
        - name: recordId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                fields:
                  type: object
                  additionalProperties: {}
                  description: Updated field values keyed by field slug. A field id or its exact display name (any language, unambiguous) is mapped to the slug; a write in which no key names a field of the Base is a 400 listing the valid slugs. If you set the base's PRIMARY field (its first field), keep it a short human-readable name — it is the record's display title everywhere.
                message:
                  anyOf:
                    - type: string
                      default: Revise operation
                      description: Explanation shown to the human reviewer. Write a conventional-commit style subject — imperative verb + what + why, e.g. "Update deal stage to qualified — demo booked for July 8".
                    - type: string
                      default: Delete record
                      description: Explanation shown to the human reviewer. Say what is being removed and why, e.g. "Archive duplicate contact — merged into Acme Corp".
                    - type: string
                author:
                  type: string
                  default: local-producer
                baseCommitId:
                  type: string
                operation:
                  anyOf:
                    - enum:
                        - update
                    - enum:
                        - delete
                    - enum:
                        - restore
                autoMerge:
                  anyOf:
                    - type: boolean
                    - type: boolean
                      description: 'Whether to approve and merge this change immediately. Omitted defaults to merging immediately if the actor has write access on the target node, otherwise falling back to a pending Change Request; pass explicit false to force review even with write access. Archiving is reversible: the record leaves every listing but is restored intact by `operation: "restore"`.'
                    - type: boolean
                      description: 'Whether to approve and merge this change immediately. Omitted defaults to merging immediately if the actor has write access on the target node, otherwise falling back to a pending Change Request; pass explicit false to force review even with write access. Restoring is itself the undo of an archive, and is undone again by `operation: "delete"`.'
                submittedBy:
                  anyOf:
                    - type: string
                      default: local-producer
                    - type: string
                      default: local-editor
                deleteMode:
                  enum:
                    - archive
                  type: string
                  default: archive
              required:
                - operation
      responses:
        "200":
          description: "Creates a record change request selected by `operation`. All three operations are permission-aware: they merge immediately when the actor has write access on the Base's node, and land as a pending Change Request otherwise or when `autoMerge: false` is passed."
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: "#/components/schemas/MaterializedRecord"
                  - $ref: "#/components/schemas/PendingChangeRequest"
  /change-requests/{changeRequestId}:
    get:
      operationId: getChangeRequest
      summary: Check a Change Request
      description: "Use it to see whether a write that was not merged immediately has been approved: `status` is `merged` once it landed."
      tags:
        - Busabase
      parameters:
        - name: changeRequestId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Change Request detail.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChangeRequest"
components:
  schemas:
    AgentClient:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
      required:
        - id
        - name
    AuthSpace:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        slug:
          type: string
          nullable: true
        plan:
          type: string
          nullable: true
        nodeVisibilityMode:
          enum:
            - open
            - restricted
          type: string
      required:
        - id
        - name
        - slug
        - plan
    Base:
      type: object
      properties:
        id:
          type: string
        nodeId:
          type: string
        slug:
          type: string
        name:
          type: string
        description:
          type: string
        reviewPolicy:
          $ref: "#/components/schemas/BaseReviewPolicy"
        createdAt:
          type: string
        fields:
          type: array
          items:
            $ref: "#/components/schemas/BaseField"
        viewerPermissionLevel:
          enum:
            - read
            - changeRequest
            - write
            - manage
          type: string
          description: The caller's effective permission level on this Base's node. Returned by `bases.get` only; omitted elsewhere.
      required:
        - id
        - nodeId
        - slug
        - name
        - description
        - reviewPolicy
        - createdAt
        - fields
    BaseField:
      type: object
      properties:
        id:
          type: string
        baseId:
          type: string
        slug:
          type: string
        name:
          anyOf:
            - type: string
              minLength: 1
            - $ref: "#/components/schemas/LocalizedFieldName"
        type:
          enum:
            - text
            - longtext
            - markdown
            - html
            - attachment
            - drive
            - relation
            - member
            - appUser
            - number
            - date
            - checkbox
            - select
            - multiselect
            - url
            - embed
            - email
            - phone
            - created_time
            - updated_time
            - created_by
            - updated_by
            - auto_number
            - ai_summary
            - ai_tags
            - code
            - json
            - yaml
            - formula
            - lookup
            - whiteboard
          type: string
        required:
          type: boolean
        position:
          type: number
        options:
          $ref: "#/components/schemas/FieldOptions"
          default: {}
      required:
        - id
        - baseId
        - slug
        - name
        - type
        - required
        - position
    BaseReviewPolicy:
      type: object
      properties:
        kind:
          enum:
            - single
        requiredApprovals:
          type: number
      required:
        - kind
        - requiredApprovals
    ChangeRequest:
      type: object
      properties:
        id:
          type: string
        baseId:
          type: string
          nullable: true
        targetType:
          enum:
            - base
            - node
          type: string
        nodeId:
